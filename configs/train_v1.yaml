# v1: 3 epochs (v0 overfit after ~2), bigger data so eval/save every 300 steps
model_name: microsoft/deberta-v3-base
labels_file: configs/labels.yaml

max_length: 512
stride: 128

learning_rate: 3.0e-5
num_train_epochs: 3
per_device_train_batch_size: 16
per_device_eval_batch_size: 32
gradient_accumulation_steps: 1
warmup_ratio: 0.1
weight_decay: 0.01
seed: 42

# checkpoint often: Colab can disconnect at any time
eval_steps: 300
save_steps: 300
save_total_limit: 2
logging_steps: 50
